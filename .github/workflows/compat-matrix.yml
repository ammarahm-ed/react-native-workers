name: Compatibility matrix

# Builds a FRESH consumer app against a range of React Native versions and Expo
# SDKs and compiles the native code, so we find out immediately when a new RN or
# Expo release breaks the library (API/ABI drift). This tests the packed npm
# tarball — the truest consumer test.
#
# Only MINOR versions are exercised (point releases are skipped): the matrix lists
# `0.81`, `0.82`, … and each resolves to the latest patch. Floating `latest`/`next`
# entries pick up brand-new releases automatically, so a breaking drop turns a job
# red without anyone editing this file.
#
# TOOLCHAIN PINNING (why some iOS jobs name an Xcode version)
# ----------------------------------------------------------
# iOS has two upstream constraints pointing in OPPOSITE directions, so no single
# Xcode builds the whole matrix. Neither is caused by this library:
#
#   * RN 0.81 / 0.82 need Xcode <= 26.1. Their pinned `fmt` uses `consteval` in a
#     way newer Clang rejects — errors land in Pods/fmt/format-inl.h, none in our
#     sources.
#   * Expo SDK 56+ needs Xcode >= 26.4. `expo-modules-jsi` uses Swift 6.3
#     `weak let`; older Swift fails with "'weak' must be a mutable variable"
#     (expo/expo#46242).
#
# Running the full range in CI is the point: the runners carry several Xcodes, so
# each job selects the one its target needs, instead of the whole matrix being
# hostage to whichever Xcode a laptop happens to have.
#
# Keep the version lists in sync with scripts/matrix.mjs (the local twin).
#
# Runs weekly (to catch new releases) and on demand. It is intentionally NOT on the
# PR hot path — it spins up many full native builds.

on:
  schedule:
    - cron: '0 6 * * 1' # every Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      include-ios:
        description: 'Also run the (slower/costlier) iOS matrix'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # ccache is what makes re-runs cheap. The defaults are wrong for this shape of
  # build, so:
  #  - the consumer app is scaffolded into a NEW path every run, so absolute paths
  #    in debug info would miss on every object (hence hash_dir=false)
  #  - Xcode passes -ivfsoverlay, module maps and timestamped system headers that
  #    are not semantically meaningful (hence the sloppiness list)
  #  - depend mode avoids re-running the preprocessor just to decide a hit
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 2G
  CCACHE_COMPILERCHECK: content
  CCACHE_DEPEND: 'true'
  CCACHE_INODECACHE: 'true'
  CCACHE_SLOPPINESS: clang_index_store,file_stat_matches,include_file_ctime,include_file_mtime,ivfsoverlay,pch_defines,modules,system_headers,time_macros
  # NOTE: the option is NOHASHDIR=true — there is no CCACHE_HASHDIR, and ccache
  # hard-errors on the unknown name instead of ignoring it, failing every compile.
  CCACHE_NOHASHDIR: 'true'
  # React Native's Podfile wires ccache into the Pods project when this is set,
  # which keeps Xcode's explicit modules working (CC/CXX wrappers silently
  # disable them).
  USE_CCACHE: '1'

jobs:
  # ---------------------------------------------------------------------------
  # Pack the library once (bob build + npm pack) and share the tarball with every
  # matrix job, so they all install the exact artifact a consumer would.
  # ---------------------------------------------------------------------------
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build + pack the library
        run: |
          yarn prepare
          npm pack --pack-destination "$RUNNER_TEMP"
          mv "$RUNNER_TEMP"/*.tgz "$RUNNER_TEMP/react-native-workers.tgz"

      - name: Upload tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: library-tarball
          path: ${{ runner.temp }}/react-native-workers.tgz
          retention-days: 3

  # ---------------------------------------------------------------------------
  # Bare React Native apps — verifies the core worker native code compiles/links
  # against each RN version. (No Expo here; the Expo bridge is exercised below.)
  # ---------------------------------------------------------------------------
  react-native-android:
    needs: pack
    runs-on: ubuntu-latest
    # `next` is a pre-release (RC/nightly) early-warning: a break there flags an
    # UPCOMING RN release, not a regression, so it warns without failing the run.
    continue-on-error: ${{ matrix.rn == 'next' }}
    strategy:
      fail-fast: false
      matrix:
        rn: ['0.81', '0.82', '0.83', '0.84', '0.85', '0.86', 'latest', 'next']
    name: rn-android (${{ matrix.rn }})
    steps:
      - name: Checkout (helper scripts)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install ccache
        run: sudo apt-get update && sudo apt-get install -y ccache

      # Keyed per target so versions never evict each other; restore-keys let a new
      # patch release start warm from the previous run of the same minor.
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-rn-android-${{ matrix.rn }}-${{ github.run_id }}
          restore-keys: |
            ccache-rn-android-${{ matrix.rn }}-
            ccache-rn-android-

      - name: Download tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: library-tarball
          path: ${{ runner.temp }}

      - name: Create RN app + install library + build Android
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          RN_VERSION=$(npm view "react-native@${{ matrix.rn }}" version)
          echo "Resolved react-native@${{ matrix.rn }} -> $RN_VERSION"
          # New Architecture (required by this library) is the default on RN 0.81+.
          npx --yes @react-native-community/cli@latest init RnApp \
            --version "$RN_VERSION" --pm npm --skip-git-init --install-pods false
          cd RnApp
          npm install "$RUNNER_TEMP/react-native-workers.tgz"
          "$GITHUB_WORKSPACE/.github/scripts/enable-android-ccache.sh" .
          cd android
          ./gradlew :app:assembleDebug -PreactNativeArchitectures=arm64-v8a --no-daemon --console=plain

      - name: ccache stats
        if: always()
        run: ccache -s | head -20

  # ---------------------------------------------------------------------------
  # Expo apps — verifies the Expo-in-worker bridge (companion Swift module + the
  # SDK 56+ Swift JSI installer on iOS; the reflective Kotlin installer on
  # Android) compiles against each Expo SDK.
  # ---------------------------------------------------------------------------
  expo-android:
    needs: pack
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: ['54', '55', '56', '57', 'latest']
    name: expo-android (sdk ${{ matrix.sdk }})
    steps:
      - name: Checkout (helper scripts)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install ccache
        run: sudo apt-get update && sudo apt-get install -y ccache

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-expo-android-${{ matrix.sdk }}-${{ github.run_id }}
          restore-keys: |
            ccache-expo-android-${{ matrix.sdk }}-
            ccache-expo-android-

      - name: Download tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: library-tarball
          path: ${{ runner.temp }}

      - name: Create Expo app (pinned SDK) + install library + prebuild + build
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          # Scaffold from the SDK-PINNED template — downgrading a latest-SDK
          # template instead conflicts on expo-router peers (same reason
          # scripts/matrix.mjs uses expo-template-blank@sdk-NN).
          TEMPLATE="expo-template-blank@sdk-${{ matrix.sdk }}"
          [ "${{ matrix.sdk }}" = "latest" ] && TEMPLATE="expo-template-blank"
          npx --yes create-expo-app@latest ExpoApp --no-install --yes --template "$TEMPLATE"
          cd ExpoApp
          npm install --legacy-peer-deps
          npx expo install --fix
          npm install "$RUNNER_TEMP/react-native-workers.tgz" --legacy-peer-deps
          # An Expo module in a worker (compile signal for the bridge).
          npx expo install expo-device expo-crypto
          npx expo prebuild --platform android --no-install
          "$GITHUB_WORKSPACE/.github/scripts/enable-android-ccache.sh" .
          cd android
          ./gradlew :app:assembleDebug -PreactNativeArchitectures=arm64-v8a --no-daemon --console=plain

      - name: ccache stats
        if: always()
        run: ccache -s | head -20

  # ---------------------------------------------------------------------------
  # iOS — now the FULL range, because each job picks the Xcode its target needs.
  # ---------------------------------------------------------------------------
  react-native-ios:
    needs: pack
    if: github.event_name == 'schedule' || inputs.include-ios
    runs-on: macos-15
    continue-on-error: ${{ matrix.rn == 'next' }}
    strategy:
      fail-fast: false
      matrix:
        rn: ['0.81', '0.82', '0.83', '0.84', '0.85', '0.86', 'latest', 'next']
        include:
          # Pinned `fmt` does not compile with newer Clang — see the header note.
          - rn: '0.81'
            xcode: '26.1'
          - rn: '0.82'
            xcode: '26.1'
    name: rn-ios (${{ matrix.rn }})
    steps:
      - name: Checkout (helper scripts)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Select Xcode
        run: .github/scripts/select-xcode.sh "${{ matrix.xcode }}"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install ccache
        run: brew list ccache >/dev/null 2>&1 || brew install ccache

      # Keyed by Xcode as well: a compiler change invalidates every object anyway,
      # so mixing toolchains in one cache only wastes space.
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-rn-ios-${{ matrix.rn }}-${{ matrix.xcode || 'default' }}-${{ github.run_id }}
          restore-keys: |
            ccache-rn-ios-${{ matrix.rn }}-${{ matrix.xcode || 'default' }}-
            ccache-rn-ios-${{ matrix.rn }}-

      - name: Download tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: library-tarball
          path: ${{ runner.temp }}

      - name: Create RN app + install library + build iOS
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          RN_VERSION=$(npm view "react-native@${{ matrix.rn }}" version)
          npx --yes @react-native-community/cli@latest init RnApp \
            --version "$RN_VERSION" --pm npm --skip-git-init --install-pods false
          cd RnApp
          npm install "$RUNNER_TEMP/react-native-workers.tgz"
          "$GITHUB_WORKSPACE/.github/scripts/build-ios.sh" .

      - name: ccache stats
        if: always()
        run: ccache -s | head -20

  expo-ios:
    needs: pack
    if: github.event_name == 'schedule' || inputs.include-ios
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        sdk: ['54', '55', '56', '57', 'latest']
        include:
          # expo-modules-jsi uses Swift 6.3 `weak let` — see the header note.
          - sdk: '56'
            xcode: '26.4'
          - sdk: '57'
            xcode: '26.4'
          - sdk: 'latest'
            xcode: '26.4'
    name: expo-ios (sdk ${{ matrix.sdk }})
    steps:
      - name: Checkout (helper scripts)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Select Xcode
        run: .github/scripts/select-xcode.sh "${{ matrix.xcode }}"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install ccache
        run: brew list ccache >/dev/null 2>&1 || brew install ccache

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-expo-ios-${{ matrix.sdk }}-${{ matrix.xcode || 'default' }}-${{ github.run_id }}
          restore-keys: |
            ccache-expo-ios-${{ matrix.sdk }}-${{ matrix.xcode || 'default' }}-
            ccache-expo-ios-${{ matrix.sdk }}-

      - name: Download tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: library-tarball
          path: ${{ runner.temp }}

      - name: Create Expo app (pinned SDK) + install library + prebuild + build
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          TEMPLATE="expo-template-blank@sdk-${{ matrix.sdk }}"
          [ "${{ matrix.sdk }}" = "latest" ] && TEMPLATE="expo-template-blank"
          npx --yes create-expo-app@latest ExpoApp --no-install --yes --template "$TEMPLATE"
          cd ExpoApp
          npm install --legacy-peer-deps
          npx expo install --fix
          npm install "$RUNNER_TEMP/react-native-workers.tgz" --legacy-peer-deps
          npx expo install expo-device expo-crypto
          npx expo prebuild --platform ios --no-install
          "$GITHUB_WORKSPACE/.github/scripts/build-ios.sh" .

      - name: ccache stats
        if: always()
        run: ccache -s | head -20
