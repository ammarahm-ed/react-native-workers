buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

// Some libraries locate react-native by shelling out to `node --print
// require.resolve(...)`. That fails when node is managed by a version manager
// (nvm/volta) and so is not on the Gradle daemon's PATH, leaving them with an
// empty path ("Cannot convert '' to File"). Point them at it explicitly.
ext {
    REACT_NATIVE_NODE_MODULES_DIR = file("$rootDir/../node_modules/react-native").absolutePath
}

apply plugin: "com.facebook.react.rootproject"
